name: Exam Platform V2 Build

on:
  push:
    branches: [main]
    paths:
      - 'exam-platform-v2/**'
      - '.github/workflows/exam-platform-v2-build.yml'
  pull_request:
    paths:
      - 'exam-platform-v2/**'
      - '.github/workflows/exam-platform-v2-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exam-platform-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: exam-platform-v2/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
